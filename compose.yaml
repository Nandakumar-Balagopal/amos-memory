services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: amos
      POSTGRES_USER: amos
      POSTGRES_PASSWORD: amos
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations/001_initial.sql:/docker-entrypoint-initdb.d/001_initial.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amos -d amos"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:

