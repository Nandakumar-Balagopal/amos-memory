name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  test:
    name: Unit and CLI smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate package metadata
        run: python -c "import tomllib; tomllib.load(open('pyproject.toml', 'rb'))"

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run CLI smoke tests
        run: |
          amos health
          amos assess "Nandu prefers concise updates" --type PREFERENCE --importance 0.8

  postgres:
    name: PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: amos
          POSTGRES_USER: amos
          POSTGRES_PASSWORD: amos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amos -d amos"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      AMOS_STORAGE_BACKEND: postgres
      AMOS_POSTGRES_DSN: postgresql://amos:amos@localhost:5432/amos
      AMOS_EMBEDDING_MODEL: hash
      AMOS_RUN_INTEGRATION: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
