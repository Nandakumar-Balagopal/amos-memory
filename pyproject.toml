[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amos-memory"
version = "0.1.0"
description = "AMOS: Agent Memory Operating System"
requires-python = ">=3.12"
dependencies = [
    "neo4j>=5.28,<7",
    "psycopg[binary]>=3.2,<4",
    "redis>=6,<8",
]

[project.scripts]
amos = "amos.api:main"
amos-mcp = "amos.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
