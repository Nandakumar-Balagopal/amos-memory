[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "amos-memory"
version = "0.2.0"
description = "AMOS: Agent Memory Operating System with Hybrid Retrieval"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    "pgvector>=0.3.0",
    "numpy>=1.26.0",
    "httpx>=0.27.0",
    "sentence-transformers>=2.7.0",
    "einops>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]
vllm = [
    "vllm>=0.4.0",
]

[project.scripts]
amos = "amos.api:main"
amos-mcp = "amos.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
